<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 88px;
      height: 88px;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer ripple ring */
    .ring {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid rgba(255, 59, 48, 0.85);
      animation: ripple 1.1s ease-out infinite;
    }
    .ring:nth-child(2) { animation-delay: 0.35s; }
    .ring:nth-child(3) { animation-delay: 0.70s; }

    @keyframes ripple {
      0%   { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.9); opacity: 0; }
    }

    /* Centre dot */
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 0 3px rgba(255,59,48,0.35);
      animation: dotPulse 1.1s ease-in-out infinite alternate;
      position: relative;
      z-index: 10;
    }

    @keyframes dotPulse {
      from { transform: scale(1);    box-shadow: 0 0 0 3px rgba(255,59,48,0.35); }
      to   { transform: scale(1.25); box-shadow: 0 0 0 7px rgba(255,59,48,0.10); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
